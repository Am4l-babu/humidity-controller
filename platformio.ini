; HygroPilot — ESP8266 PID humidity controller
; Build:   pio run            Upload:  pio run -t upload        Monitor: pio device monitor
; The web UI (web/index.html) is gzipped into HumidityController/webpage.h automatically before each build.

[platformio]
src_dir = HumidityController
default_envs = nodemcuv2

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld      ; 4 MB flash: 3 MB sketch/OTA + 1 MB LittleFS
extra_scripts = pre:tools/embed_web.py
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SHT31 Library@^2.2.2

; NodeMCU v2/v3 (ESP-12E)
[env:nodemcuv2]
board = nodemcuv2

; Wemos / LOLIN D1 mini
[env:d1_mini]
board = d1_mini
